<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pikachu</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <img class="pikachu" src="./assets/pikachu-img.png" alt="" />

      <div class="left">
        <div class="nav">
          <img src="./assets/pokemon-logo.png" alt="" />
        </div>

        <div class="content">
          <div class="heading">
            <h2>pokemon gen 1</h2>
          </div>

          <div class="title">
            <h1>Pikachu</h1>
          </div>

          <div class="para">
            <p>
              Pikachu is an Electric-type Pokémon introduced <br />
              in Generation 1. Pikachu are small, chubby, <br />
              and incredibly cute mouse-like Pokémon. <br />
              They are almost completely covered by <br />
              yellow fur.
            </p>
          </div>

          <div class="count">
            <h3><span>───</span> 01 / 08</h3>
          </div>
        </div>

        <div class="ball">
          <img src="./assets/pikachu-ball.png" alt="" />
        </div>
      </div>

      <div class="right">
        <div class="menu">
          <img src="./assets/menu-line.png" alt="" />
        </div>

        <div class="dots">
          <div class="active-dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
  </body>
</html>
